<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School ERP — Low Level Design (LLD) Interactive Diagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: rgba(30, 41, 59, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation / Controls Bar */
    header {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-primary {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .controls-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--bg-secondary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #334155;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      font-weight: 600;
      border-color: var(--accent-blue);
    }

    .filter-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      gap: 2px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      color: #fff;
    }

    .filter-btn.active {
      background: #334155;
      color: #fff;
      font-weight: 600;
    }

    /* Diagram Canvas Container */
    #canvas-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    #diagram-output {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Loading Overlay */
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Legend Overlay */
    .legend-card {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 11px;
      z-index: 40;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .legend-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .legend-items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Floating Zoom Controls */
    .floating-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 40;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      justify-content: center;
      font-size: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-section">
      <span class="badge badge-primary">Database LLD</span>
      <h1>School ERP Entity-Relationship Model</h1>
    </div>

    <div class="filter-tabs">
      <button class="filter-btn active" onclick="switchView('full')">Full ER Model (All Tables)</button>
      <button class="filter-btn" onclick="switchView('academic')">Academic Setup</button>
      <button class="filter-btn" onclick="switchView('fee')">Fee & Billing</button>
      <button class="filter-btn" onclick="switchView('identity')">Identity & RBAC</button>
      <button class="filter-btn" onclick="switchView('student')">Student & Guardian</button>
    </div>

    <div class="controls-section">
      <button class="btn" onclick="fitView()">Reset View</button>
      <button class="btn btn-primary" style="background: var(--accent-blue); color: #0f172a; font-weight: 600;" onclick="downloadSVG()">Download SVG</button>
      <button class="btn" onclick="window.print()">Export / Print</button>
    </div>
  </header>

  <main id="canvas-container">
    <div id="diagram-output">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <span>Rendering Interactive Entity-Relationship Diagram...</span>
      </div>
    </div>

    <div class="legend-card">
      <div class="legend-title">Domains & Color Codes</div>
      <div class="legend-items">
        <div class="legend-item"><span class="legend-dot" style="background: #38bdf8;"></span> Tenancy & Subscriptions</div>
        <div class="legend-item"><span class="legend-dot" style="background: #a855f7;"></span> Identity & Security</div>
        <div class="legend-item"><span class="legend-dot" style="background: #34d399;"></span> Academic Setup (Anchor: Section)</div>
        <div class="legend-item"><span class="legend-dot" style="background: #fbbf24;"></span> Student Placement & Guardians</div>
        <div class="legend-item"><span class="legend-dot" style="background: #f43f5e;"></span> Fee Management & Payments</div>
        <div class="legend-item"><span class="legend-dot" style="background: #818cf8;"></span> RBAC & Permissions</div>
      </div>
    </div>

    <div class="floating-controls">
      <button class="btn icon-btn" onclick="zoomIn()" title="Zoom In">+</button>
      <button class="btn icon-btn" onclick="zoomOut()" title="Zoom Out">−</button>
      <button class="btn icon-btn" onclick="fitView()" title="Fit View">⛶</button>
    </div>
  </main>

  <script>
    let panZoomInstance = null;

    const diagrams = {
      full: `
erDiagram
    %% Tenancy & Subscription
    SCHOOL ||--o| SCHOOL_SUBSCRIPTION : "current sub"
    SCHOOL ||--o{ SCHOOL_SUBSCRIPTION : "history"
    PLAN ||--o{ SCHOOL_SUBSCRIPTION : "under"
    PLAN ||--o{ PLAN_FEATURE : gates
    FEATURE ||--o{ PLAN_FEATURE : enables
    SCHOOL ||--o{ TOP_UP_PACK : buys
    SCHOOL ||--o{ USAGE_LEDGER : tracks

    %% Identity & RBAC
    SCHOOL ||--o{ ADMIN : employs
    SCHOOL ||--o{ TEACHER : employs
    SCHOOL ||--o{ PARENT_ACCOUNT : scopes
    SCHOOL ||--o{ ROLE : custom_roles
    ROLE ||--o{ ROLE_PERMISSION : grants
    PERMISSION ||--o{ ROLE_PERMISSION : mapped_to
    ROLE ||--o{ ACTOR_ROLE_ASSIGNMENT : assigned_in

    %% Academic Setup (Anchor Entity: SECTION)
    SCHOOL ||--o{ ACADEMIC_YEAR : schedules
    SCHOOL ||--o{ GRADE : defines
    SCHOOL ||--o{ DEPARTMENT : organizes
    SCHOOL ||--o{ SUBJECT : offers
    GRADE ||--o{ SECTION : groups
    ACADEMIC_YEAR ||--o{ SECTION : bounds
    TEACHER ||--o| SECTION : class_teacher
    DEPARTMENT ||--o| TEACHER : hod
    TEACHER ||--o{ TEACHER_DEPARTMENT_MAP : in
    DEPARTMENT ||--o{ TEACHER_DEPARTMENT_MAP : contains
    SECTION ||--o{ SECTION_SUBJECT_MAP : curriculum
    SUBJECT ||--o{ SECTION_SUBJECT_MAP : in_curriculum
    SECTION ||--o{ SECTION_SUBJECT_TEACHER : assigns
    SUBJECT ||--o{ SECTION_SUBJECT_TEACHER : for_subject
    TEACHER ||--o{ SECTION_SUBJECT_TEACHER : teaches

    %% Student & Enrollment
    SCHOOL ||--o{ STUDENT : enrolls
    PARENT_ACCOUNT ||--o{ GUARDIAN : holds
    STUDENT ||--o{ GUARDIAN : guardian_of
    STUDENT ||--o{ ENROLLMENT : attends
    SECTION ||--o{ ENROLLMENT : hosts

    %% Fee Management & Payments
    SCHOOL ||--o{ FEE_COMPONENT : establishes
    SECTION ||--o{ SECTION_FEE_STRUCTURE : prices
    FEE_COMPONENT ||--o{ SECTION_FEE_STRUCTURE : itemizes
    STUDENT ||--o{ FEE_INVOICE : billed_to
    ENROLLMENT ||--o{ FEE_INVOICE : generated_from
    FEE_INVOICE ||--o{ FEE_INVOICE_LINE : has_lines
    FEE_COMPONENT ||--o{ FEE_INVOICE_LINE : component
    STUDENT ||--o{ PAYMENT : tenders
    PAYMENT ||--o{ PAYMENT_ALLOCATION : settles
    FEE_INVOICE ||--o{ PAYMENT_ALLOCATION : paid_by
    FEE_INVOICE ||--o{ FEE_WAIVER_LOG : waived_by
    PAYMENT ||--o{ REFUND : reversed_by

    %% Communication
    SCHOOL ||--o{ BROADCAST : dispatches
    TEACHER ||--o{ BROADCAST : sends
    TEACHER ||--o| TEACHER_BROADCAST_QUOTA : allocated
    SCHOOL ||--o{ MESSAGE_TEMPLATE : template

    %% Definitions
    SCHOOL {
        uuid id PK
        string name
        string contact_email
        string contact_phone
        uuid current_subscription_id FK
        string status
    }
    PLAN {
        uuid id PK
        string code UK
        decimal monthly_price
        decimal yearly_price
        int student_cap
        int teacher_cap
        boolean active
    }
    SCHOOL_SUBSCRIPTION {
        uuid id PK
        uuid school_id FK
        uuid plan_id FK
        string billing_cycle
        date start_date
        date end_date
        string status
        int override_max_students
        int override_max_teachers
    }
    ADMIN {
        uuid id PK
        uuid school_id FK
        string name
        string msisdn UK
        string password_hash
    }
    TEACHER {
        uuid id PK
        uuid school_id FK
        string employee_code UK
        string login_msisdn UK
        string name
        string designation
        boolean password_set
    }
    PARENT_ACCOUNT {
        uuid id PK
        uuid school_id FK
        string msisdn UK
        string name
        boolean password_set
    }
    GRADE {
        uuid id PK
        uuid school_id FK
        string name
        int sequence_order
    }
    SECTION {
        uuid id PK
        uuid school_id FK
        uuid grade_id FK
        uuid academic_year_id FK
        string name
        uuid class_teacher_id FK
        int capacity
    }
    STUDENT {
        uuid id PK
        uuid school_id FK
        string student_code UK
        string name
        date dob
        string phone
    }
    ENROLLMENT {
        uuid id PK
        uuid student_id FK
        uuid section_id FK
        string roll_no
        string status
    }
    GUARDIAN {
        uuid id PK
        uuid parent_account_id FK
        uuid student_id FK
        string relation
        boolean is_primary
    }
    FEE_COMPONENT {
        uuid id PK
        uuid school_id FK
        string name
        string code UK
    }
    SECTION_FEE_STRUCTURE {
        uuid id PK
        uuid section_id FK
        uuid fee_component_id FK
        decimal amount
        string frequency
    }
    FEE_INVOICE {
        uuid id PK
        uuid student_id FK
        uuid enrollment_id FK
        string year_month UK
        date due_date
        decimal total_amount
        decimal paid_amount
        decimal balance
        string status
    }
    PAYMENT {
        uuid id PK
        uuid student_id FK
        decimal amount
        string mode
        string gateway_txn_id UK
        string status
    }
    PAYMENT_ALLOCATION {
        uuid id PK
        uuid payment_id FK
        uuid invoice_id FK
        decimal allocated_amount
    }
    REFUND {
        uuid id PK
        uuid payment_id FK
        decimal amount
        string mode
        string reason
    }
      `,

      academic: `
erDiagram
    SCHOOL ||--o{ ACADEMIC_YEAR : schedules
    SCHOOL ||--o{ GRADE : defines
    SCHOOL ||--o{ DEPARTMENT : organizes
    SCHOOL ||--o{ SUBJECT : offers
    GRADE ||--o{ SECTION : groups
    ACADEMIC_YEAR ||--o{ SECTION : bounds
    TEACHER ||--o| SECTION : class_teacher
    DEPARTMENT ||--o| TEACHER : hod
    TEACHER ||--o{ TEACHER_DEPARTMENT_MAP : in
    DEPARTMENT ||--o{ TEACHER_DEPARTMENT_MAP : contains
    SECTION ||--o{ SECTION_SUBJECT_MAP : curriculum
    SUBJECT ||--o{ SECTION_SUBJECT_MAP : in_curriculum
    SECTION ||--o{ SECTION_SUBJECT_TEACHER : assigns
    SUBJECT ||--o{ SECTION_SUBJECT_TEACHER : for_subject
    TEACHER ||--o{ SECTION_SUBJECT_TEACHER : teaches

    SECTION {
        uuid id PK
        uuid school_id FK
        uuid grade_id FK
        uuid academic_year_id FK
        string name
        uuid class_teacher_id FK
        int capacity
    }
    GRADE {
        uuid id PK
        uuid school_id FK
        string name
        int sequence_order
    }
    ACADEMIC_YEAR {
        uuid id PK
        uuid school_id FK
        string name
        date start_date
        date end_date
        string status
    }
    DEPARTMENT {
        uuid id PK
        uuid school_id FK
        string name
        string code UK
        uuid hod_teacher_id FK
    }
    SUBJECT {
        uuid id PK
        uuid school_id FK
        string name
        string code UK
        uuid department_id FK
    }
    TEACHER {
        uuid id PK
        uuid school_id FK
        string name
        string employee_code UK
    }
      `,

      fee: `
erDiagram
    SCHOOL ||--o{ FEE_COMPONENT : establishes
    SECTION ||--o{ SECTION_FEE_STRUCTURE : configures
    FEE_COMPONENT ||--o{ SECTION_FEE_STRUCTURE : itemizes
    STUDENT ||--o{ FEE_INVOICE : billed
    ENROLLMENT ||--o{ FEE_INVOICE : based_on
    FEE_INVOICE ||--o{ FEE_INVOICE_LINE : itemized_by
    FEE_COMPONENT ||--o{ FEE_INVOICE_LINE : categorizes
    STUDENT ||--o{ PAYMENT : tenders
    PAYMENT ||--o{ PAYMENT_ALLOCATION : distributes
    FEE_INVOICE ||--o{ PAYMENT_ALLOCATION : settled_by
    FEE_INVOICE ||--o{ FEE_WAIVER_LOG : adjusted_by
    PAYMENT ||--o{ REFUND : reversed_by

    FEE_COMPONENT {
        uuid id PK
        uuid school_id FK
        string name
        string code
    }
    SECTION_FEE_STRUCTURE {
        uuid id PK
        uuid section_id FK
        uuid fee_component_id FK
        decimal amount "10,2"
        string frequency
    }
    FEE_INVOICE {
        uuid id PK
        uuid student_id FK
        uuid enrollment_id FK
        string year_month UK
        date due_date
        decimal total_amount
        decimal paid_amount
        decimal balance
        string status
    }
    PAYMENT {
        uuid id PK
        uuid student_id FK
        decimal amount
        string mode
        string gateway_txn_id UK
        string status
    }
    PAYMENT_ALLOCATION {
        uuid id PK
        uuid payment_id FK
        uuid invoice_id FK
        decimal allocated_amount
    }
    REFUND {
        uuid id PK
        uuid payment_id FK
        decimal amount
        string mode
        string reason
    }
      `,

      identity: `
erDiagram
    SCHOOL ||--o{ ADMIN : employs
    SCHOOL ||--o{ TEACHER : employs
    SCHOOL ||--o{ PARENT_ACCOUNT : registers
    SCHOOL ||--o{ ROLE : defines
    ROLE ||--o{ ROLE_PERMISSION : contains
    PERMISSION ||--o{ ROLE_PERMISSION : grants
    ROLE ||--o{ ACTOR_ROLE_ASSIGNMENT : assigned_to

    ADMIN {
        uuid id PK
        uuid school_id FK
        string name
        string msisdn UK
        string password_hash
    }
    TEACHER {
        uuid id PK
        uuid school_id FK
        string employee_code UK
        string login_msisdn UK
        string name
        boolean password_set
    }
    PARENT_ACCOUNT {
        uuid id PK
        uuid school_id FK
        string msisdn UK
        string name
        boolean password_set
    }
    ROLE {
        uuid id PK
        uuid school_id FK
        string name
        boolean system_role
    }
    PERMISSION {
        uuid id PK
        string code UK
        string module
    }
    ACTOR_ROLE_ASSIGNMENT {
        uuid id PK
        string actor_type
        uuid actor_id
        uuid role_id FK
    }
      `,

      student: `
erDiagram
    SCHOOL ||--o{ STUDENT : enrolls
    PARENT_ACCOUNT ||--o{ GUARDIAN : holds
    STUDENT ||--o{ GUARDIAN : cared_by
    STUDENT ||--o{ ENROLLMENT : participates
    SECTION ||--o{ ENROLLMENT : accommodates

    STUDENT {
        uuid id PK
        uuid school_id FK
        string student_code UK
        string name
        string phone
        date dob
    }
    ENROLLMENT {
        uuid id PK
        uuid student_id FK
        uuid section_id FK
        string roll_no
        string status "ACTIVE | PROMOTED | TRANSFERRED"
    }
    GUARDIAN {
        uuid id PK
        uuid parent_account_id FK
        uuid student_id FK
        string relation
        boolean is_primary
    }
    PARENT_ACCOUNT {
        uuid id PK
        uuid school_id FK
        string msisdn UK
        string name
    }
    SECTION {
        uuid id PK
        string name
    }
      `
    };

    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0f172a',
        primaryColor: '#1e293b',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#38bdf8',
        lineColor: '#64748b',
        secondaryColor: '#334155',
        tertiaryColor: '#1e293b'
      },
      er: {
        diagramPadding: 30,
        layoutDirection: 'TB',
        minEntityWidth: 120,
        minEntityHeight: 80,
        entityPadding: 16,
        stroke: '#475569',
        fill: '#1e293b',
        fontSize: 12,
        useMaxWidth: false
      }
    });

    async function renderDiagram(code) {
      const container = document.getElementById('diagram-output');
      container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><span>Rendering Diagram...</span></div>';
      
      try {
        const { svg } = await mermaid.render('mermaid-svg', code);
        container.innerHTML = svg;
        
        const svgElement = container.querySelector('svg');
        svgElement.style.width = '100%';
        svgElement.style.height = '100%';

        if (panZoomInstance) {
          panZoomInstance.destroy();
        }

        panZoomInstance = svgPanZoom(svgElement, {
          zoomEnabled: true,
          controlIconsEnabled: false,
          fit: true,
          center: true,
          minZoom: 0.2,
          maxZoom: 10,
          zoomScaleSensitivity: 0.25
        });

      } catch (err) {
        container.innerHTML = '<div style="color: #f43f5e; padding: 20px;">Render Error: ' + err.message + '</div>';
      }
    }

    function switchView(viewKey) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderDiagram(diagrams[viewKey]);
    }

    function zoomIn() {
      if (panZoomInstance) panZoomInstance.zoomIn();
    }

    function zoomOut() {
      if (panZoomInstance) panZoomInstance.zoomOut();
    }

    function fitView() {
      if (panZoomInstance) {
        panZoomInstance.reset();
        panZoomInstance.fit();
        panZoomInstance.center();
      }
    }

    function downloadSVG() {
      const svgEl = document.querySelector('#diagram-output svg');
      if (!svgEl) return;
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svgEl);
      if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'school-erp-lld.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      renderDiagram(diagrams.full);
    });
  </script>
</body>
</html>
